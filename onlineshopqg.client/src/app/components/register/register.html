<div class="page-container">
  <div class="card-purple" style="max-width: 650px; margin: 0 auto;">
    <h2 class="title-purple text-center">Create Your Account</h2>
    <p class="text-center mb-40" style="color: #666;">Join our CLOTHING SHOP and set up your billing details for a faster checkout.</p>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="registration-form">

      <!-- Account Info -->
      <div class="form-section">
        <h4 class="sidebar-title">Account Details</h4>
        <div class="form-grid-2">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" [(ngModel)]="user.name" required class="input-purple" placeholder="John Doe">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" [(ngModel)]="user.email" required class="input-purple" placeholder="john@example.com">
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" [(ngModel)]="user.password" required class="input-purple" placeholder="••••••••">
        </div>
      </div>

      <!-- Billing & Shipping -->
      <div class="form-section mt-40">
        <h4 class="sidebar-title">Billing Address</h4>

        <div class="form-group">
          <label>Street Address</label>
          <input type="text" name="addressLine" [(ngModel)]="user.addressLine" required class="input-purple" placeholder="123 Purple Lane">
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>City</label>
            <input type="text" name="city" [(ngModel)]="user.city" required class="input-purple">
          </div>
          <div class="form-group">
            <label>State / Province</label>
            <input type="text" name="state" [(ngModel)]="user.state" required class="input-purple">
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Zip Code</label>
            <input type="text" name="zipCode" [(ngModel)]="user.zipCode" required class="input-purple">
          </div>
          <div class="form-group">
            <label>Country</label>
            <input type="text" name="country" [(ngModel)]="user.country" required class="input-purple">
          </div>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" name="phoneNumber" [(ngModel)]="user.phoneNumber" required class="input-purple" placeholder="+40 7xx xxx xxx">
        </div>
      </div>

      <div *ngIf="errorMessage" style="color: #d9534f; background-color: #f9ecec; border: 1px solid #d9534f; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-weight: 500;">
        <i class="fa fa-exclamation-circle"></i> {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="!registerForm.form.valid" class="btn-purple mt-40">
        Register Now
      </button>

      <p class="text-center mt-20" style="font-size: 0.9rem;">
        Already have an account? <a routerLink="/login" style="color: var(--accent-purple); font-weight: bold;">Login here</a>
      </p>

    </form>
  </div>
</div>
