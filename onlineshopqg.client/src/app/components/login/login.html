<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
  <h2 style="text-align: center;">Login</h2>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Email</label>
      <input type="email" name="email" [(ngModel)]="credentials.email " required
             style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;">Password</label>
      <input type="password" name="password" [(ngModel)]="credentials.password" required
             style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>

    <button type="submit" [disabled]="!loginForm.form.valid"
            style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Login
    </button>

    <p class="text-center mt-20" style="font-size: 0.9rem;">
      Don't have an account? <a routerLink="/register" style="color: var(--accent-purple); font-weight: bold;">Register here</a>
    </p>

  </form>
</div>
